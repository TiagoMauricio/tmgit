[project]
name = "tmgit"
version = "0.2.1"
description = "tmgit is an opinionated git wrapper built with Typer to automate the commands I use the most during my workday to match my workflow."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.10.0",
    "typer>=0.25.1",
]

[project.scripts]
tmgit = "tmgit.main:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
